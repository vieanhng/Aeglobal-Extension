<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Duplicator & Mover Options</title>
    <link href="lib/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 p-6 font-sans text-gray-800">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Công cụ nhân bản câu hỏi</h1>

        <div class="mb-6 bg-blue-50 border border-blue-200 rounded-md p-4 text-sm text-blue-800">
            <p>UID đã lưu: <span id="displayUid" class="font-semibold">Đang tải...</span></p>
            <p>Token đã lưu: <span id="displayToken" class="font-semibold break-all">Đang tải...</span></p>
            <p class="mt-2 text-gray-600">Ngày lưu: <span id="displaySavedDate" class="font-semibold">Đang tải...</span>
            </p>
            <p class="mt-2 text-gray-600">Bạn có thể thay đổi UID/Token bằng cách mở lại Popup của tiện ích.</p>
        </div>

        <hr class="my-6 border-gray-200">

        <div class="mb-6">
            <label for="question-ids" class="block text-sm font-medium text-gray-700 mb-1">Danh sách ID câu hỏi
                gốc</label>
            <textarea id="question-ids" rows="8" placeholder="Nhập ID câu hỏi, mỗi ID trên một dòng"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm resize-y"></textarea>
            <p class="mt-2 text-sm text-gray-500">Ví dụ: 12345, 67890, ...</p>
        </div>

        <div class="mb-6">
            <div class="flex justify-between items-center mb-1">
                <label for="bank-links" class="block text-sm font-medium text-gray-700">Danh sách link NHCH đích</label>
                <button id="validateBanksBtn"
                    class="inline-flex items-center px-3 py-1 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    <svg id="validateSpinner" class="animate-spin -ml-1 mr-2 h-4 w-4 text-gray-700 hidden"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    <span id="validateBtnText">✓ Validate ngân hàng</span>
                </button>
            </div>
            <textarea id="bank-links" rows="8"
                placeholder="Nhập link ngân hàng hoặc ID, mỗi link/ID trên một dòng&#10;Ví dụ:&#10;https://aeglobal.lotuslms.com/admin/question-bank/12345&#10;67890&#10;https://aeglobal.lotuslms.com/admin/folder/abc123"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm resize-y"></textarea>

            <!-- Validation Results -->
            <div id="validationResults" class="mt-3 hidden">
                <div class="bg-gray-50 border border-gray-200 rounded-lg p-3">
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="text-sm font-semibold text-gray-700">Kết quả validate:</h4>
                        <span id="validationSummary" class="text-xs text-gray-600"></span>
                    </div>
                    <div id="validationList" class="space-y-1 max-h-40 overflow-y-auto">
                        <!-- Validation items will be inserted here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-center mb-6">
            <button id="startDuplicationBtn"
                class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
                <span id="buttonText">Nhân bản câu hỏi</span>
                <svg id="loadingSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
            </button>
        </div>

        <div id="statusResult" class="mt-4 p-4 rounded-md hidden">
            <p id="message" class="font-medium"></p>
        </div>

        <!-- Real-time Log Display -->
        <div id="logContainer" class="mt-6 hidden">
            <div class="bg-gray-50 border border-gray-300 rounded-lg overflow-hidden">
                <div class="bg-gray-700 text-white px-4 py-3 flex justify-between items-center cursor-pointer"
                    id="logHeader">
                    <h3 class="text-lg font-medium flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                            </path>
                        </svg>
                        Chi tiết xử lý từng câu hỏi
                    </h3>
                    <button id="toggleLog" class="text-sm bg-gray-600 hover:bg-gray-500 px-3 py-1 rounded transition">
                        Thu gọn
                    </button>
                </div>
                <div id="logContent" class="bg-gray-900 text-gray-100 p-4 font-mono text-sm max-h-96 overflow-y-auto">
                    <div id="logMessages"></div>
                </div>
                <div class="bg-gray-700 px-4 py-2 flex justify-between items-center text-xs text-gray-300">
                    <span id="logStats">Tổng: 0 dòng</span>
                    <button id="clearLog" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded transition">
                        Xóa log
                    </button>
                </div>
            </div>
        </div>

        <div id="detailedResults" class="mt-6 hidden">
            <h3 class="text-lg font-medium text-gray-900 mb-3">Kết quả tổng hợp:</h3>
            <ul id="resultsList" class="list-disc list-inside space-y-2">
            </ul>
        </div>
    </div>

    <script src="shared-auth.js"></script>
    <script src="shared-ui.js"></script>
    <script src="shared-bank-utils.js"></script>
    <script src="question-duplicator.js"></script>
</body>

</html>
